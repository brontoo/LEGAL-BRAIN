<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    ترويسة «أحمد عيد» — الرمز: النجمة الثمانية (خاتم).

    ⚠️ ولماذا النجمة الثمانية؟
      • «خاتم» في العربية تعني الخاتم والختم معاً — وهي فعل المكتب: يختم ويتوّج.
      • زخرفة هندسية إسلامية تقليدية في مطبوعات الكتب والوثائق الرسمية — مِلك عام،
        فلا رخصة ولا إسناد (بخلاف كل أيقونة استُخدمت في الواجهة).
      • هندسية لا تصويرية، والصياغة القانونية شكلية لا تصويرية.
      • **مربّعان متقاطعان فحسب** — حادّة عند ١٦ بكسل وعند ٢٠٠.

    ⚠️ والهندسة: مربّع بضلع ١٥ (٨.٥ → ٢٣.٥) ومربّع مثله مائل ٤٥°،
       فنصف قطره ٧.٥ × √٢ ≈ ١٠.٦ → رؤوسه عند ١٦ ± ١٠.٦ = ٥.٤ و ٢٦.٦.
       و**تساوي المربّعين شرط** لتناظر النجمة: لو كبر المائل لطغى، ولو صغر لاختفى.

    ⚠️ وخلفية داكنة مقصودة: الأيقونة تظهر على تبويبات بيضاء وفاتحة أيضاً.
  -->
  <rect width="32" height="32" fill="#16130F"/>
  <rect x="8.5" y="8.5" width="15" height="15" fill="none" stroke="#C9A227" stroke-width="1.5"/>
  <path d="M16 5.4 L26.6 16 L16 26.6 L5.4 16 Z" fill="none" stroke="#C9A227" stroke-width="1.5"/>
</svg>
