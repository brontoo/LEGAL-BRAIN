<!--
  ==============================================================================
  يُحقن هذا الملف داخل <head> لإطار المعاينة (preview iframe) في Storybook.
  ==============================================================================
  الغرض: محاكاة ما يفعله تطبيقك الحقيقي في frontend/app/layout.tsx حرفياً:

      <html lang="ar" dir="rtl" className="dark">

  ثوابت المشروع التي نُحاكيها:
    dir="rtl"      → اتجاه النص العربي (يؤثر في كل التخطيط)
    lang="ar"      → مهم لقارئات الشاشة ولفحص الوصولية
    class="dark"   → متغيّرات الثيم الداكن من app/globals.css

  بدون هذا الملف تُرسم المكوّنات بالثيم الفاتح وباتجاه LTR — أي بخلاف
  ما يراه المستخدم فعلاً، فتفقد القصص قيمتها.

  ⚠️ ملاحظة من الوثائق: هذا الملف لا يخضع للـ HMR، فأعد تشغيل Storybook
  بعد تعديله.
-->
<script>
  (function () {
    var root = document.documentElement;
    root.setAttribute("lang", "ar");
    root.setAttribute("dir", "rtl");
    root.classList.add("dark");
  })();
</script>

<!--
  خط Tajawal — نفس خط التطبيق.
  في التطبيق يأتي عبر next/font/google الذي لا يعمل داخل Storybook، فنجلبه
  من Google Fonts مباشرة ونعرّف --font-sans كما يفعل next/font.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --font-sans: "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /*
    خلفية التطبيق الحقيقية.
    في frontend/app/layout.tsx:
        <body className="... bg-slate-950 text-slate-50 ...">
    والتطبيق داكن فقط — لا يوجد مبدّل ثيم، و className="dark" مثبَّت في layout.tsx.
    لذلك نفرض الخلفية الداكنة بلا شرط. بدونها تُرسم القصص على لوحة Storybook
    البيضاء، وهي خلفية لا يراها مستخدمك أبداً.
  */
  html,
  body {
    background-color: #020617; /* slate-950 */
    color: #f8fafc; /* slate-50 */
  }
</style>
